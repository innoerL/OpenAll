<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 18px clamp(16px, 4vw, 32px); background: #222625; color: #e9e7df; font: 400 14px/1.65 -apple-system,BlinkMacSystemFont,sans-serif; }
    h1,h2,h3,h4,h5,h6 { line-height: 1.3; margin: .95em 0 .4em; font-weight: 600; }
    main { max-width: 68ch; margin: 0 auto; overflow-wrap: anywhere; }
    main>:first-child { margin-top: 0; }
    h1 { font-size: 1.65em; border-bottom: 1px solid #454b47; padding-bottom: .34em; }
    h2 { font-size: 1.3em; }
    p { margin: 10px 0; }
    ul,ol { padding-left: 1.5em; }
    li { margin: .2em 0; }
    code,pre { font: 13px/1.55 SFMono-Regular,Menlo,monospace; background: #343a36; border-radius: 5px; }
    code { padding: 2px 5px; }
    pre { padding: 12px 15px; overflow: auto; overflow-wrap: normal; }
    pre code { padding: 0; }
    blockquote { border-left: 3px solid #cfb58d; color: #c6c9bf; margin: 1em 0; padding: .15em 1em; }
    .gap { height: 0; }
    .table-wrap { overflow-x: auto; margin: 12px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th,td { padding: 6px 10px; border-bottom: 1px solid #454b47; vertical-align: top; }
    th { font-weight: 500; color: #bfc5bb; }
    li.task { list-style: none; margin-left: -1.5em; display: flex; align-items: baseline; gap: 9px; }
    li.task input { accent-color: #d5bf99; flex: none; }
    .empty,.diagram-error { color: #9da49c; font-size: 13px; }
    a { color: #d5bf99; text-decoration: none; }
    img { max-width: 100%; height: auto; border-radius: 8px; }
    .diagram { overflow: auto; padding: 18px; margin: 14px 0; border: 1px solid #454b47; border-radius: 10px; background: #292e2b; text-align: center; }
    .diagram svg { max-width: 100%; height: auto; }
    .diagram .edgeLabel rect { fill: #292e2b !important; opacity: 1 !important; }
    .diagram .edgeLabel span { background: #292e2b !important; }
    .diagram-error { text-align: left; white-space: pre-wrap; }
    body.has-diagram { padding-top: 48px; }
    .zoom-controls { display: none; position: fixed; z-index: 3; top: 8px; right: 12px; gap: 4px; align-items: center; padding: 3px; border: 1px solid #454b47; border-radius: 8px; background: #292e2b; }
    body.has-diagram .zoom-controls { display: flex; }
    .zoom-controls button { min-width: 26px; height: 24px; padding: 0 5px; border: 0; border-radius: 5px; background: transparent; color: #e9e7df; cursor: pointer; }
    .zoom-controls button:hover { background: #454b47; }
    .zoom-controls output { min-width: 40px; text-align: center; color: #bfc5bb; font-size: 11px; }
  </style>
  <script src="mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'dark', suppressErrorRendering: true });
    let revision = 0;
    let latestMarkdownHTML = '';
    let zoom = 1;
    function changeZoom(delta) {
      zoom = Math.min(2, Math.max(0.5, Math.round((zoom + delta) * 10) / 10));
      document.querySelector('main').style.zoom = zoom;
      document.querySelector('#zoom-value').textContent = Math.round(zoom * 100) + '%';
    }
    window.refreshOpenAllDiagramTheme = () => window.renderMarkdown(latestMarkdownHTML);
    window.renderMarkdown = async html => {
      latestMarkdownHTML = html;
      const current = ++revision;
      const main = document.querySelector('main');
      main.innerHTML = html;
      const diagrams = [...main.querySelectorAll('.diagram')];
      document.body.classList.toggle('has-diagram', diagrams.length > 0);
      for (const [index, node] of diagrams.entries()) {
        const source = node.textContent;
        try {
          const result = await mermaid.render(`openall-${current}-${index}`, source);
          if (current !== revision) return;
          node.innerHTML = result.svg;
          result.bindFunctions?.(node);
        } catch (error) {
          if (current !== revision) return;
          node.replaceChildren();
          const label = document.createElement('div');
          label.className = 'diagram-error';
          label.textContent = '绘图语法尚未完整或有误，请检查左侧代码。';
          node.appendChild(label);
        }
      }
    };
  </script>
</head>
<body><div class="zoom-controls" aria-label="图形预览缩放"><button type="button" onclick="changeZoom(-0.1)" aria-label="缩小">−</button><output id="zoom-value">100%</output><button type="button" onclick="changeZoom(0.1)" aria-label="放大">＋</button><button type="button" onclick="changeZoom(1-zoom)" aria-label="重置缩放" title="重置缩放">适应</button></div><main><p class="empty">预览会在这里呈现</p></main></body>
</html>
