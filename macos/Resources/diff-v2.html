<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'">
  <title>文本对比</title>
  <link rel="stylesheet" href="gold-ui/surface-effects.css">
  <style>
    /* finesse · register=product · shell=双栏文本编辑器 */
    :root { color-scheme: dark; --canvas:#1b1c1d; --surface:#202425; --raised:#30332f; --ink:#efeee6; --muted:#a2a69e; --secondary:#b8b7b2; --rule:rgba(255,255,255,.065); --accent:#cfb58d; --removed:rgba(197,92,105,.22); --added:rgba(65,164,112,.22); --changed-left:rgba(197,92,105,.12); --changed-right:rgba(65,164,112,.12); --removed-token:rgba(197,92,105,.50); --added-token:rgba(65,164,112,.50); --removed-ink:#d99b9e; --added-ink:#8dbea1; font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--canvas); color:var(--ink); overflow:hidden; }
    .toolbar { height:44px; flex:none; display:flex; align-items:center; gap:12px; padding:0 20px; }
    .comparison-status { display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
    #summary { display:flex; align-items:baseline; gap:12px; flex:0 1 auto; min-width:0; color:var(--ink); white-space:nowrap; overflow:hidden; }
    .summary-primary { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; font-size:13px; font-weight:500; }
    .summary-details { flex:none; color:var(--secondary); font-size:12px; }
    .summary-primary .changed { color:var(--accent); }
    .summary-primary .added { color:var(--added-ink); }
    .summary-primary .removed { color:var(--removed-ink); }
    .options,.filters { display:flex; align-items:center; gap:12px; flex:none; }
    .options { border-left:1px solid var(--rule); padding-left:14px; }
    .filter-slot { display:contents; }
    #open-search[aria-expanded=true],.filters[hidden],.compact-options[hidden],.options-panel[hidden] { display:none; }
    .compact-options { position:relative; }
    #options-toggle { display:flex; align-items:center; gap:8px; }
    #options-toggle::after { content:""; width:5px; height:5px; border:solid currentColor; border-width:0 1.5px 1.5px 0; transform:translateY(-1px) rotate(45deg); }
    #options-toggle[aria-expanded=true] { background:var(--surface); border-color:var(--secondary); }
    .options-panel {
      position:absolute; z-index:4; top:calc(100% + 4px); right:0; width:174px; padding:10px 12px;
      background:var(--raised); border:1px solid var(--rule); border-radius:6px;
    }
    .options-panel .filters { display:grid; justify-items:start; gap:8px; }
    .options-panel .filters[hidden] { display:none; }
    .options-panel .filters::before { content:attr(aria-label); font-size:11px; font-weight:600; color:var(--secondary); }
    .options-panel #find-scope { width:100%; }
    .options-panel label { color:var(--ink); }
    .options-panel .filters + .filters { margin-top:10px; padding-top:9px; border-top:1px solid var(--rule); }
    label { color:var(--muted); font-size:13px; white-space:nowrap; cursor:pointer; }
    input[type=checkbox] { appearance:none; -webkit-appearance:none; position:relative; width:14px; height:14px; border:1px solid var(--muted); border-radius:3px; background:transparent; vertical-align:-2px; margin:0 6px 0 0; cursor:pointer; }
    input[type=checkbox]:checked { border-color:var(--accent); background:var(--accent); }
    input[type=checkbox]:checked::after { content:""; position:absolute; left:4px; top:1px; width:3px; height:7px; border:solid var(--canvas); border-width:0 1.5px 1.5px 0; transform:rotate(45deg); }
    input[type=checkbox]:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    button { height:28px; border:.5px solid var(--rule); border-radius:6px; background:transparent; color:var(--ink); padding:4px 9px; font:400 13px -apple-system,BlinkMacSystemFont,sans-serif; cursor:pointer; }
    button:enabled:hover { background:var(--raised); }
    .navigation {
      display:inline-flex; align-items:center; flex:none; gap:0; padding:1px 2px 1px 9px;
      border:1px solid var(--rule); border-radius:6px; background:var(--surface);
      font-variant-numeric:tabular-nums; white-space:nowrap;
    }
    .navigation[hidden] { display:none; }
    .nav-label { font-size:12px; font-weight:600; color:var(--accent); }
    #navigation-count { padding:0 9px 0 6px; font-size:12px; color:var(--ink); }
    .navigation button,.match-nav button {
      flex:none; display:grid; place-items:center; width:28px; height:26px; padding:0;
      border:0; border-radius:4px; color:var(--ink); font:inherit;
    }
    .navigation button:focus-visible,.match-nav button:focus-visible { outline-offset:-2px; }
    .navigation button:first-of-type { border-left:1px solid var(--rule); border-radius:0 4px 4px 0; }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    button:disabled { opacity:.35; cursor:default; }
    .editors { flex:1; min-height:0; margin:0 20px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); border:.5px solid var(--rule); border-radius:6px; overflow:hidden; background:var(--surface); }
    .pane { min-width:0; min-height:0; display:flex; flex-direction:column; }
    .pane + .pane { border-left:.5px solid var(--rule); }
    .heading {
      flex: none; display: flex; align-items: center; justify-content: space-between;
      height: 36px; padding: 0 10px 0 14px; gap: 8px;
      background: var(--surface); border-bottom: 1px solid var(--rule);
    }
    .pane-title { display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; }
    body:has(#find-query:focus) #hint { visibility:hidden; }
    .pane[data-target] .pane-title strong {
      color:var(--accent); text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:5px;
    }
    .pane-title strong { font-size: 13px; font-weight: 600; }
    .count { color: var(--secondary); font-size: 12px; font-variant-numeric: tabular-nums; }
    .pane-actions { display: flex; align-items: center; gap: 2px; }
    .pane-actions button {
      height: 26px; padding: 0 7px; border: 0; border-radius: 4px;
      color: var(--secondary); background: transparent; font-size: 12px; white-space: nowrap;
    }
    .pane-actions button:is(:hover,:focus-visible):enabled { background: var(--raised); color: var(--ink); }
    #open-search { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
    #open-search kbd { color: var(--secondary); font: inherit; font-size: 11px; }
    .findbar { flex:none; display:flex; align-items:center; gap:10px; margin:0 20px; padding:0 0 7px; }
    .findbar[hidden] { display:none; }
    .query-field {
      flex:1; min-width:0; display:flex; align-items:center; height:32px; gap:7px; padding:0 2px 0 9px;
      background:var(--surface); border:1px solid var(--rule); border-radius:6px;
    }
    .query-field:focus-within { border-color:var(--accent); }
    .find-icon {
      position:relative; flex:none; width:11px; height:11px; margin:0 3px 2px 0;
      border:1.5px solid currentColor; border-radius:50%; color:var(--secondary);
    }
    .find-icon::after {
      content:""; position:absolute; left:8px; top:8px; width:5px; height:1.5px;
      border-radius:1px; background:currentColor; transform-origin:left center; transform:rotate(45deg);
    }
    #find-query {
      flex:1; min-width:0; height:28px; padding:0; border:0; background:transparent;
      color:var(--ink); font:inherit; outline:none;
    }
    #find-query::placeholder { color:var(--muted); }
    .match-nav { flex:none; display:flex; align-items:center; padding-left:8px; border-left:1px solid var(--rule); }
    .match-nav:has(button:enabled) :is(#find-count,button:enabled),.find-icon { color:var(--match-ink,var(--ink)); }
    .query-field:focus-within { border-color:var(--match-ink,var(--accent)); }
    .match-nav[hidden] { display:none; }
    #find-count { padding:0 6px 0 0; color:var(--secondary); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; }
    #find-scope {
      flex:none; width:98px; height:28px; padding:0 22px 0 9px; appearance:none; border:1px solid var(--rule);
      border-radius:5px; background-color:var(--canvas); color:var(--ink); font-size:12px;
      background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
      background-position:calc(100% - 13px) 12px,calc(100% - 8px) 12px; background-size:5px 5px; background-repeat:no-repeat;
    }
    .findbar label { flex:none; color:var(--secondary); font-size:12px; }
    #find-close { flex:none; width:28px; padding:0; border:0; color:var(--secondary); }
    .cm-contentMatch { background:rgba(86,153,218,.18); outline:1px solid rgba(86,153,218,.35); outline-offset:-1px; border-radius:2px; }
    .cm-contentMatch.active { background:rgba(86,153,218,.32); outline:2px solid #7bb2e5; outline-offset:-1px; }
    .cm-contentMatch .cm-diffToken { outline:1px solid #7bb2e5; outline-offset:1px; }
    .editor { position:relative; flex:1; min-height:0; overflow:hidden; }
    .editor .cm-editor { height:100%; background:transparent; color:var(--ink); }
    .editor .cm-editor.cm-focused { outline:none; }
    .editor .cm-scroller { overflow:auto; font:400 14px/22px ui-monospace,"SFMono-Regular",Menlo,Monaco,"PingFang SC",monospace; font-synthesis:none; -webkit-font-smoothing:antialiased; font-variant-ligatures:none; font-kerning:none; letter-spacing:0; word-spacing:0; tab-size:4; }
    .editor .cm-content { padding:12px 0; caret-color:var(--accent); }
    .editor .cm-line { padding:0 12px; line-height:22px; }
    .editor .cm-gutters { background:transparent; border:0; color:var(--secondary); font-size:12.5px; line-height:22px; }
    .editor .cm-changeGutter { width:19px; }
    .editor .cm-changeGutter .cm-gutterElement { padding:0 0 0 7px; text-align:center; }
    .editor .cm-lineNumbers .cm-gutterElement { min-width:35px; padding:0 8px 0 0; }
    .cm-changeMark { font-weight:500; }
    .cm-changeMark.added { color:var(--added-ink); }
    .cm-changeMark.removed { color:var(--removed-ink); }
    .cm-changeMark.changed-left,.cm-changeMark.changed-right,.cm-changeMark.current { color:var(--accent); }
    .cm-diffLine.added { background:var(--added); }
    .cm-diffLine.removed { background:var(--removed); }
    .cm-diffLine.changed-left { background:var(--changed-left); }
    .cm-diffLine.changed-right { background:var(--changed-right); }
    .cm-diffLine.current { box-shadow:inset 3px 0 var(--accent); }
    .cm-diffToken { border-radius:2px; }
    .cm-diffToken.removed { background:var(--removed-token); box-shadow:inset 0 -2px var(--removed-ink); }
    .cm-diffToken.added { background:var(--added-token); box-shadow:inset 0 -2px var(--added-ink); }
    .cm-diffGap { position:relative; display:inline-block; width:0; height:1em; vertical-align:-.1em; }
    .cm-diffGap::after { content:""; position:absolute; inset:0 auto 0 -1px; width:2px; border-radius:1px; }
    .cm-diffGap.removed::after { background:var(--removed-ink); }
    .cm-diffGap.added::after { background:var(--added-ink); }
    .cm-diffSpacer { pointer-events:auto; }
    .editor .cm-cursor { border-left-color:var(--accent); }
    .editor .cm-selectionBackground,.editor .cm-focused .cm-selectionBackground { background:rgba(160,146,108,.35); }
    .editor .cm-placeholder { color:var(--muted); }
    footer { flex:none; height:30px; padding:0 20px; display:flex; align-items:center; color:var(--secondary); font-size:12px; }
    #hint { margin-left:auto; text-align:right; }
    /* 宽窗里栏名对齐首列正文，窄窗保留横向空间。 */
    @media (min-width:800px) {
      .heading { padding-inline-start:calc(var(--gutter-width, 54px) + 12px); }
    }
    @media (max-width:850px) {
      .toolbar,.comparison-status,#summary { gap:8px; }
      .options { gap:12px; }
      #hint { max-width:40%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    }
    @media (max-width:730px) {
      .toolbar { height:38px; padding-inline:12px; }
      .options { gap:6px; padding-left:0; border:0; }
      .editors,.findbar { margin-inline:12px; }
      footer { padding-inline:12px; }
      .heading { padding-inline:8px; }
      .findbar { gap:6px; padding-bottom:6px; }
    }
    .diff-symbol { margin-inline-end:4px; font:600 14px/1 ui-monospace,monospace; }
    @media (max-width:620px) {
      .editor .cm-changeGutter { width:14px; }
      .editor .cm-changeGutter .cm-gutterElement { padding-left:2px; }
      .editor .cm-lineNumbers .cm-gutterElement { min-width:22px; padding-right:3px; }
      .editor .cm-line { padding-inline:6px; }
      .heading { gap:2px; }
      .pane-title { gap:5px; }
      .heading button { padding-inline:5px; }
      #hint .switch-keys { display:none; }
    }
    .toolbar .findbar { flex:1; min-width:0; max-width:520px; margin:0 0 0 auto; padding:0; gap:4px; }
    .toolbar:has(.findbar:not([hidden])) .comparison-status { flex:0 1 auto; }
    .toolbar:has(.findbar:not([hidden])) .options { padding-left:0; border:0; }
    .pane-menu { margin-left:auto; position:relative; }
    .pane-menu > summary { display:none; }
    .pane-menu .pane-actions { display:flex; gap:2px; }
    @media (max-width:900px) {
      .toolbar:has(.findbar:not([hidden])) .comparison-status:has(.navigation:not([hidden])) #summary { display:none; }
      .toolbar:has(.findbar:not([hidden])) #summary { max-width:120px; }
    }
    @media (max-width:730px) {
      .pane-menu > summary { display:flex; align-items:center; justify-content:center; height:28px; width:32px; border-radius:4px; cursor:pointer; color:var(--secondary); list-style:none; letter-spacing:1px; }
      .pane-menu > summary::-webkit-details-marker { display:none; }
      .pane-menu > summary:is(:hover,:focus-visible),.pane-menu[open] > summary { background:var(--raised); color:var(--ink); }
      .pane-menu > summary:focus-visible { outline:2px solid var(--accent); }
      .pane-menu .pane-actions { position:absolute; right:0; top:100%; display:grid; z-index:6; min-width:98px; padding:4px; border:1px solid var(--rule); border-radius:6px; background:var(--raised); }
      .pane-menu .pane-actions button { margin:0; text-align:left; padding-inline:8px; }
      .pane-menu .pane-actions button:enabled:hover { background:var(--surface); }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="comparison-status">
      <div class="navigation" role="group" aria-label="差异组导航" hidden>
        <span class="nav-label"><span class="diff-symbol" aria-hidden="true">±</span>差异</span>
        <span id="navigation-count" role="status" aria-live="polite" aria-atomic="true">0 / 0</span>
        <button id="previous" title="上一个差异组" aria-label="上一个差异组" disabled>↑</button>
        <button id="next" title="下一个差异组" aria-label="下一个差异组" disabled>↓</button>
      </div>
      <div id="summary" role="status" aria-live="polite" aria-atomic="true"><span class="summary-primary notice">在左右两侧输入文本，差异会直接标出</span></div>
    </div>
    <div class="options">
    <button id="open-search" title="搜索内容（⌘F）" aria-label="搜索内容" aria-controls="findbar" aria-expanded="false">搜索 <kbd aria-hidden="true">⌘F</kbd></button>
      <div id="comparison-filter-slot" class="filter-slot">
        <div id="comparison-filters" class="filters" role="group" aria-label="对比选项">
          <label><input id="sync-scroll" type="checkbox" checked>同步滚动</label>
          <label><input id="ignore-space" type="checkbox">忽略行尾空格</label>
        </div>
      </div>
      <div class="compact-options" hidden>
        <button id="options-toggle" aria-expanded="false" aria-controls="options-panel">选项</button>
        <div id="options-panel" class="options-panel" role="group" aria-label="文本对比选项" hidden></div>
      </div>
    </div>
  </div>
  <div class="findbar" id="findbar" role="search" aria-label="搜索对比内容" hidden>
    <div class="query-field">
      <span class="find-icon" aria-hidden="true"></span>
      <input id="find-query" type="search" placeholder="搜索内容" aria-label="搜索内容" autocomplete="off" spellcheck="false">
      <div class="match-nav" role="group" aria-label="搜索匹配导航" hidden>
        <span id="find-count" role="status" aria-live="polite" aria-atomic="true"></span>
        <button id="find-previous" title="上一个匹配（⇧↵ / ⇧⌘G）" aria-label="上一个搜索结果" disabled>↑</button>
        <button id="find-next" title="下一个匹配（↵ / ⌘G）" aria-label="下一个搜索结果" disabled>↓</button>
      </div>
    </div>
    <div id="find-filter-slot" class="filter-slot">
      <div id="find-filters" class="filters" role="group" aria-label="查找选项" hidden>
        <select id="find-scope" aria-label="搜索范围"><option value="both">左右两侧</option><option value="0">仅左侧</option><option value="1">仅右侧</option></select>
        <label><input id="find-case" type="checkbox">区分大小写</label>
      </div>
    </div>
    <button id="find-close" title="关闭搜索（Esc）" aria-label="关闭搜索">×</button>
  </div>
  <div class="editors">
    <section class="pane" data-target>
      <div class="heading"><div class="pane-title"><strong>左侧</strong><span class="count" id="left-count">0 行</span></div><details class="pane-menu" open><summary aria-label="左侧操作" title="左侧操作">•••</summary><div class="pane-actions"><button class="natural-sort" data-side="0" title="左侧按行自然升序，item2 排在 item10 前；支持撤销" aria-label="左侧按行自然升序">自然排序</button><button class="copy" data-side="0" title="复制左侧全文" aria-label="复制左侧全文">复制</button></div></details></div>
      <div class="editor" id="left"></div>
    </section>
    <section class="pane">
      <div class="heading"><div class="pane-title"><strong>右侧</strong><span class="count" id="right-count">0 行</span></div><details class="pane-menu" open><summary aria-label="右侧操作" title="右侧操作">•••</summary><div class="pane-actions"><button class="natural-sort" data-side="1" title="右侧按行自然升序，item2 排在 item10 前；支持撤销" aria-label="右侧按行自然升序">自然排序</button><button class="copy" data-side="1" title="复制右侧全文" aria-label="复制右侧全文">复制</button></div></details></div>
      <div class="editor" id="right"></div>
    </section>
  </div>
  <footer><span id="footer-status" role="status" aria-live="polite">已对齐</span><span id="hint"><span id="paste-target">粘贴到左侧</span><span class="switch-keys"> · ⌘1 / ⌘2 切换左右</span></span></footer>
  <script src="gold-ui/surface-effects.js"></script>
  <script src="diff-core.js"></script>
  <script src="comparison-editor.js"></script>
  <script src="diff-v2.js"></script>
</body>
</html>
